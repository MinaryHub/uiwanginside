# 파이에서 실행하는 구성. 이 파일과 Caddyfile, .env 를 파이의 같은 폴더에 둔다.
#
#   ~/uiwanginside/
#     compose.yaml
#     Caddyfile
#     .env          ← 비밀값. 600 권한으로 두고 저장소에 넣지 않는다
#
# 이미지는 GitHub 에서 만들어 ghcr.io 에 둔다(.github/workflows/image.yml).
# 파이는 받아서 돌리기만 한다 — ./update.sh
#
# 파이에서 직접 빌드하지 않는다. node_modules 571MB + .next 837MB 에 도커
# 층마다의 사본까지 더하면 2.5~3.5GB 인데, SD 카드에 2.5GB 밖에 없고 스왑도
# 없어 빌드 도중에 죽는다. 재봤다.
#
# 맥에서 급히 올릴 때도(scripts/deploy-pi.sh) 같은 이름으로 넣으므로, 그때는
# 받아오지 않고 들어 있는 것을 쓴다.

services:
  app:
    # TAG 를 .env 에 적으면 특정 판으로 못 박을 수 있다
    image: ${UIWANG_IMAGE:-ghcr.io/minaryhub/uiwanginside}:${TAG:-latest}
    container_name: uiwanginside
    restart: unless-stopped
    env_file: .env
    # 호스트에 포트를 열지 않는다 — 바깥에서 들어오는 길은 caddy 하나로 좁힌다.
    expose:
      - "3000"
    networks: [web]
    # 파이의 메모리를 앱이 다 먹고 시스템이 굶는 일을 막는다
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서를 남긴다 — 없으면 재시작마다 재발급을 시도해
      # Let's Encrypt 발급 한도에 걸린다
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
